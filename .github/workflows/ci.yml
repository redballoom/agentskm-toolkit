name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
      - name: Install build checks
        run: python -m pip install --upgrade build twine pyyaml
      - name: Check repository purity
        run: python scripts/check_repo_purity.py
      - name: Check version contract
        shell: bash
        run: |
          python scripts/check_versions.py
          if python scripts/check_versions.py --simulate-mismatch; then
            echo "version contract accepted an intentional mismatch"
            exit 1
          fi
      - name: Validate plugin package
        run: python scripts/build_plugin.py --check
      - name: Run acceptance workflow
        run: python tests/acceptance/test_km_workflow.py
      - name: Build wheel and sdist
        run: python -m build
      - name: Check package metadata
        run: python -m twine check dist/*
      - name: Verify wheel in an isolated environment
        shell: bash
        run: |
          set -euo pipefail
          temp_root="$(mktemp -d)"
          trap 'rm -rf "$temp_root"' EXIT
          python -m venv "$temp_root/venv"
          . "$temp_root/venv/bin/activate"
          python -m pip install dist/*.whl
          agentskm --version
          agentskm --help
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' | agentskm mcp --profile ci --host generic --bootstrap-role contributor --config "$temp_root/config.json" > "$temp_root/mcp.jsonl"
          grep -q '"name":"agentskm"' "$temp_root/mcp.jsonl"
          grep -q '"km_propose_capture"' "$temp_root/mcp.jsonl"
