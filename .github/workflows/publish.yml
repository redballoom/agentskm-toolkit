name: publish

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Package index to publish to"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Run self-contained acceptance workflow
        run: python tests/acceptance/test_km_workflow.py

      - name: Check release contracts
        run: |
          python scripts/check_repo_purity.py
          python scripts/check_versions.py
          python scripts/build_plugin.py --check

  build:
    name: Build and verify package
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Install wheel and smoke test CLI
        shell: bash
        run: |
          set -euo pipefail
          expected_version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install dist/*.whl
          test "$(agentskm --version)" = "$expected_version"

      - name: Smoke test MCP setup and tools
        shell: bash
        run: |
          set -euo pipefail
          . .venv/bin/activate
          temp_root="$(mktemp -d)"
          trap 'rm -rf "$temp_root"' EXIT
          config="$temp_root/config.json"
          {
            printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}'
            printf '%s\n' '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
            printf '%s\n' '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"km_setup_status","arguments":{}}}'
          } | agentskm mcp --profile hermes-agent --host hermes --bootstrap-role contributor --config "$config" > "$temp_root/mcp.jsonl"
          grep -q '"name":"agentskm"' "$temp_root/mcp.jsonl"
          grep -q '"km_propose_capture"' "$temp_root/mcp.jsonl"
          test -d "$temp_root/vault/000_Inbox"

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    environment: testpypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/

      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi' && github.ref == 'refs/heads/main')
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
